<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Analysis System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Student Result Analysis System</h1>

<div class="form">
    <input type="text" id="name" placeholder="Student Name">

    <input type="number" id="m1" placeholder="Subject 1">

    <input type="number" id="m2" placeholder="Subject 2">

    <input type="number" id="m3" placeholder="Subject 3">

    <input type="number" id="m4" placeholder="Subject 4">

    <input type="number" id="m5" placeholder="Subject 5">

    <button onclick="addStudent()">Add Student</button>
</div>

<table id="resultTable">

<thead>
<tr>
<th>Name</th>
<th>Total</th>
<th>Average</th>
<th>Highest</th>
<th>Lowest</th>
<th>Grade</th>
<th>Result</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

</div>

<script src="script.js"></script>

</body>
</html>
