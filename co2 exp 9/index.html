<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart & Billing System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Shopping Cart & Billing System</h1>

<label>Product</label>
<select id="product">
<option value="500">Laptop - ₹500</option>
<option value="300">Headphone - ₹300</option>
<option value="200">Keyboard - ₹200</option>
<option value="150">Mouse - ₹150</option>
</select>

<label>Quantity</label>
<input type="number" id="qty" min="1" value="1">

<button onclick="addProduct()">Add to Cart</button>

<table>

<thead>
<tr>
<th>Product</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>

<tbody id="cartBody">

</tbody>

</table>

<div class="bill">

<h3>Subtotal : ₹<span id="subtotal">0</span></h3>

<h3>Discount (10%) : ₹<span id="discount">0</span></h3>

<h3>Tax (5%) : ₹<span id="tax">0</span></h3>

<h2>Grand Total : ₹<span id="grandTotal">0</span></h2>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
