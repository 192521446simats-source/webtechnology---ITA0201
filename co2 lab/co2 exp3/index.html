<!DOCTYPE html>
<html>
<head>
    <title>Scientific Calculator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .calculator {
            width: 360px;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #4a148c;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 25px;
            text-align: right;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #673ab7;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 12px;
        }

        button {
            height: 55px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #ede7f6;
            transition: 0.3s;
        }

        button:hover {
            background: #7e57c2;
            color: white;
        }

        .operator {
            background: #ff9800;
            color: white;
        }

        .scientific {
            background: #26a69a;
            color: white;
        }

        .equal {
            background: #4caf50;
            color: white;
            grid-column: span 2;
        }

        .clear {
            background: #e53935;
            color:white;
        }

    </style>
</head>


<body>

<div class="calculator">

<h2>Scientific Calculator</h2>

<input type="text" id="display" readonly>


<div class="buttons">

<button class="scientific" onclick="calculate('sin')">sin</button>
<button class="scientific" onclick="calculate('cos')">cos</button>
<button class="scientific" onclick="calculate('tan')">tan</button>
<button class="scientific" onclick="calculate('log')">log</button>


<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('/')">÷</button>


<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="operator" onclick="appendValue('*')">×</button>


<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button class="operator" onclick="appendValue('-')">−</button>


<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>
<button class="scientific" onclick="calculate('sqrt')">√</button>
<button class="operator" onclick="appendValue('+')">+</button>


<button class="scientific" onclick="calculate('pow')">x²</button>
<button class="clear" onclick="clearDisplay()">C</button>

<button class="equal" onclick="calculateResult()">=</button>


</div>

</div>


<script>

let display = document.getElementById("display");


// Display values
function appendValue(value)
{
    display.value += value;
}


// Clear screen
function clearDisplay()
{
    display.value="";
}


// Arithmetic calculation
function calculateResult()
{
    try
    {
        display.value = eval(display.value);
    }
    catch
    {
        display.value="Error";
    }
}


// Scientific operations using Math object

function calculate(operation)
{
    let value = Number(display.value);

    switch(operation)
    {

        case "sin":
            display.value = Math.sin(value * Math.PI / 180);
            break;


        case "cos":
            display.value = Math.cos(value * Math.PI / 180);
            break;


        case "tan":
            display.value = Math.tan(value * Math.PI / 180);
            break;


        case "log":
            display.value = Math.log10(value);
            break;


        case "sqrt":
            display.value = Math.sqrt(value);
            break;


        case "pow":
            display.value = Math.pow(value,2);
            break;

    }
}


</script>


</body>
</html>
