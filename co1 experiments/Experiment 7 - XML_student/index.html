<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2430;
    --ledger-blue:#274060;
    --ledger-blue-deep:#1a2c47;
    --paper:#eef1ee;
    --paper-card:#ffffff;
    --rule:#c9d0d6;
    --stamp:#a13d3d;
    --accent:#3f6b52;
    --muted:#5c6773;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 42px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:48px 24px 80px;
  }

  header{
    max-width:1000px;
    margin:0 auto 36px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px solid var(--ledger-blue);
    padding-bottom:18px;
    flex-wrap:wrap;
    gap:16px;
  }

  header .title-block h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:2.4rem;
    margin:0 0 4px;
    color:var(--ledger-blue-deep);
    letter-spacing:-0.01em;
  }

  header .title-block p{
    margin:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .count-stamp{
    font-family:'IBM Plex Mono', monospace;
    text-align:right;
    color:var(--stamp);
    border:2px solid var(--stamp);
    border-radius:4px;
    padding:8px 14px;
    transform:rotate(-2deg);
    font-size:0.85rem;
    line-height:1.3;
  }

  .count-stamp strong{ display:block; font-size:1.3rem; }

  .controls{
    max-width:1000px;
    margin:0 auto 28px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }

  .controls input{
    flex:1;
    min-width:220px;
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    padding:12px 14px;
    border:1.5px solid var(--rule);
    border-radius:6px;
    background:var(--paper-card);
    color:var(--ink);
  }
  .controls input:focus{ outline:2px solid var(--ledger-blue); outline-offset:1px; }

  #grid{
    max-width:1000px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:18px;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:0;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(27,36,48,0.06);
    display:flex;
    flex-direction:column;
  }

  .card-head{
    background:var(--ledger-blue-deep);
    color:#eef1ee;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .card-head .roll{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    letter-spacing:0.06em;
    opacity:0.85;
  }

  .card-head .year-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    border:1px solid rgba(255,255,255,0.4);
    border-radius:20px;
    padding:2px 9px;
  }

  .card-body{ padding:16px; }

  .card-body h2{
    font-family:'Source Serif 4', serif;
    font-size:1.25rem;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
  }

  .dept{
    font-size:0.82rem;
    color:var(--accent);
    font-weight:600;
    margin:0 0 14px;
  }

  .meta-row{
    display:flex;
    gap:8px;
    font-size:0.85rem;
    color:var(--muted);
    padding:6px 0;
    border-top:1px dashed var(--rule);
  }
  .meta-row:first-of-type{ border-top:1px dashed var(--rule); margin-top:2px;}
  .meta-row span.label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    color:#9aa4ad;
    min-width:52px;
    padding-top:1px;
  }

  #empty, #loading{
    max-width:1000px;
    margin:40px auto;
    text-align:center;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.9rem;
  }

  footer{
    max-width:1000px;
    margin:48px auto 0;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:#9aa4ad;
    letter-spacing:0.05em;
  }

  @media (max-width:520px){
    header{ flex-direction:column; align-items:flex-start; }
    .count-stamp{ transform:none; align-self:flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Student Registry</h1>
    <p>Departmental roll &middot; sourced from students.xml</p>
  </div>
  <div class="count-stamp" id="countStamp">— records</div>
</header>

<div class="controls">
  <input type="text" id="searchBox" placeholder="Search by name, department, or roll number…" aria-label="Search students">
</div>

<div id="loading">Reading students.xml…</div>
<div id="empty" style="display:none;">No matching records found.</div>
<div id="grid"></div>

<footer>STUDENT REGISTRY &mdash; GENERATED FROM LOCAL XML SOURCE</footer>

<script>
  let allStudents = [];

  function renderStudents(list){
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    grid.innerHTML = '';

    if(list.length === 0){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <span class="roll">ROLL #${s.rollNumber}</span>
          <span class="year-badge">YEAR ${s.year}</span>
        </div>
        <div class="card-body">
          <h2>${s.name}</h2>
          <p class="dept">${s.department}</p>
          <div class="meta-row"><span class="label">Email</span><span>${s.email}</span></div>
          <div class="meta-row"><span class="label">Mobile</span><span>${s.mobileNumber}</span></div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function updateStamp(count){
    document.getElementById('countStamp').innerHTML = `<strong>${count}</strong>on record`;
  }

  function applyFilter(){
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const filtered = allStudents.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.department.toLowerCase().includes(q) ||
      s.rollNumber.toLowerCase().includes(q)
    );
    renderStudents(filtered);
  }

  document.getElementById('searchBox').addEventListener('input', applyFilter);

  fetch('students.xml')
    .then(res => {
      if(!res.ok) throw new Error('students.xml not found next to index.html');
      return res.text();
    })
    .then(xmlText => {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'application/xml');

      const parserError = xmlDoc.querySelector('parsererror');
      if(parserError) throw new Error('Could not parse students.xml — check it is valid XML.');

      const studentNodes = xmlDoc.getElementsByTagName('student');
      allStudents = Array.from(studentNodes).map(node => ({
        rollNumber: node.getElementsByTagName('rollNumber')[0]?.textContent ?? '',
        name: node.getElementsByTagName('name')[0]?.textContent ?? '',
        department: node.getElementsByTagName('department')[0]?.textContent ?? '',
        year: node.getElementsByTagName('year')[0]?.textContent ?? '',
        email: node.getElementsByTagName('email')[0]?.textContent ?? '',
        mobileNumber: node.getElementsByTagName('mobileNumber')[0]?.textContent ?? ''
      }));

      document.getElementById('loading').style.display = 'none';
      updateStamp(allStudents.length);
      renderStudents(allStudents);
    })
    .catch(err => {
      document.getElementById('loading').innerHTML =
        `Could not load data: ${err.message}<br>Tip: open this page through a local server (e.g. VS Code "Live Server"), not by double-clicking the file.`;
    });
</script>

</body>
</html>
