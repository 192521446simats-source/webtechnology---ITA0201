<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Quiz Application</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-card">

<h1>Online Quiz</h1>

<form id="quizForm">

<div class="question">
<h3>1. HTML stands for?</h3>

<label><input type="radio" name="q1" value="0"> Hyper Trainer Marking Language</label>

<label><input type="radio" name="q1" value="1"> Hyper Text Markup Language</label>

<label><input type="radio" name="q1" value="0"> Hyper Text Marketing Language</label>

<label><input type="radio" name="q1" value="0"> High Text Markup Language</label>

</div>

<div class="question">
<h3>2. Which language is used for styling webpages?</h3>

<label><input type="radio" name="q2" value="0"> HTML</label>

<label><input type="radio" name="q2" value="1"> CSS</label>

<label><input type="radio" name="q2" value="0"> Python</label>

<label><input type="radio" name="q2" value="0"> Java</label>

</div>

<div class="question">
<h3>3. Which language is used for website interactivity?</h3>

<label><input type="radio" name="q3" value="0"> C</label>

<label><input type="radio" name="q3" value="0"> C++</label>

<label><input type="radio" name="q3" value="1"> JavaScript</label>

<label><input type="radio" name="q3" value="0"> SQL</label>

</div>

<button type="button" id="submitBtn">Submit Quiz</button>

</form>

<h2 id="result"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
